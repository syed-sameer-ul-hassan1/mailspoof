<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>500 - Server Error | MailSpoof | Orildo</title>
<meta name="description" content="500 - Internal server error on MailSpoof by Orildo. Something went wrong on our end. Please try again later.">
<meta name="robots" content="noindex, follow">
<link rel="canonical" href="https://mailspoof.orildo.sbs/500.html">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=K2D:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg: #0a0a0a;
  --text: #e5e5e5;
  --text-dim: #888;
  --accent: #A01F1F;
  --accent-hover: #c02a2a;
  --border: #222;
  --font: 'K2D', sans-serif;
  --mono: 'JetBrains Mono', monospace;
}
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}
.error-container {
  text-align: center;
  padding: 40px;
  max-width: 600px;
  animation: fadeIn 0.6s ease-out;
}
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}
.error-code {
  font-size: 120px;
  font-weight: 800;
  color: var(--accent);
  line-height: 1;
  margin-bottom: 20px;
  animation: pulse 2s infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.8; transform: scale(1.05); }
}
.error-title {
  font-size: 28px;
  font-weight: 700;
  margin-bottom: 16px;
}
.error-message {
  color: var(--text-dim);
  font-size: 16px;
  line-height: 1.6;
  margin-bottom: 32px;
}
.error-actions {
  display: flex;
  gap: 16px;
  justify-content: center;
  flex-wrap: wrap;
}
.btn {
  padding: 12px 28px;
  border-radius: 8px;
  font-family: var(--font);
  font-weight: 600;
  font-size: 14px;
  text-decoration: none;
  transition: all 0.3s ease;
  cursor: pointer;
  border: none;
}
.btn-primary {
  background: var(--accent);
  color: white;
}
.btn-primary:hover {
  background: var(--accent-hover);
  transform: translateY(-2px);
}
.btn-secondary {
  background: transparent;
  color: var(--text);
  border: 1px solid var(--border);
}
.btn-secondary:hover {
  border-color: var(--accent);
  color: var(--accent);
}
.error-icon {
  width: 80px;
  height: 80px;
  margin: 0 auto 24px;
  animation: shake 0.5s ease-in-out infinite;
}
@keyframes shake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-5px) rotate(-5deg); }
  75% { transform: translateX(5px) rotate(5deg); }
}
.error-icon svg {
  width: 100%;
  height: 100%;
  fill: var(--accent);
}
.retry-info {
  margin-top: 24px;
  padding: 16px;
  background: rgba(160, 31, 31, 0.1);
  border: 1px solid var(--accent);
  border-radius: 8px;
  font-size: 14px;
  color: var(--text-dim);
}
.retry-count {
  font-family: var(--mono);
  color: var(--accent);
  font-weight: 700;
}
</style>
</head>
<body>
<div class="error-container">
  <div class="error-icon">
    <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
  </div>
  <div class="error-code" id="errorCode">500</div>
  <h1 class="error-title">Server Error</h1>
  <p class="error-message">Something went wrong on our end. Our team has been notified and is working to fix the issue.</p>
  <div class="error-actions">
    <button onclick="retryPage()" class="btn btn-primary">Try Again</button>
    <a href="View/home.html" class="btn btn-secondary">Go Home</a>
  </div>
  <div class="retry-info">
    Auto-retry in <span class="retry-count" id="retryCount">10</span> seconds...
  </div>
</div>

<script src="logs/security.js"></script>
<script>
let retryCount = 10;
const retryCountEl = document.getElementById('retryCount');

// Countdown for auto-retry
const countdownInterval = setInterval(() => {
  retryCount--;
  retryCountEl.textContent = retryCount;
  if (retryCount <= 0) {
    clearInterval(countdownInterval);
    retryPage();
  }
}, 1000);

// Retry function
function retryPage() {
  clearInterval(countdownInterval);
  // Reload the page that caused the error
  if (document.referrer) {
    window.location.href = document.referrer;
  } else {
    window.location.href = 'View/home.html';
  }
}

// Manual retry button
function retryPage() {
  clearInterval(countdownInterval);
  window.location.reload();
}

// Track 500 errors (optional - can be connected to analytics)
console.log('500 Error - Server error:', window.location.href);
console.log('Referrer:', document.referrer);
console.log('User Agent:', navigator.userAgent);
</script>
</body>
</html>
